include: package:flutter_lints/flutter.yaml

# Витрина — отдельный пакет со своими зависимостями, анализируется в своей папке.
analyzer:
  exclude:
    - widgetbook/**

formatter:
  page_width: 120

linter:
  rules:
    - prefer_single_quotes
    - require_trailing_commas
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
