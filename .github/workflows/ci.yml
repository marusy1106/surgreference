name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI по всей истории вместо gitleaks-action: тот сканирует диапазон коммитов пуша
      # и падает, если в нём есть корневой коммит.
      - name: gitleaks
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surgreference
          POSTGRES_PASSWORD: surgreference
          POSTGRES_DB: surgreference
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surgreference"
          --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://surgreference:surgreference@localhost:5432/surgreference
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Module boundaries
        run: lint-imports
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test widgetbook/lib
      - name: Analyze
        run: flutter analyze
      - name: Analyze widgetbook
        working-directory: mobile/widgetbook
        run: flutter pub get && flutter analyze
      # Контраст, переполнения при шрифте 200 %, тач-цели. Эталонные скриншоты — в mobile-goldens.
      - name: Tests
        run: flutter test --exclude-tags golden

  mobile-goldens:
    # Сглаживание шрифтов отличается между Linux и macOS, эталоны сняты на macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Golden tests
        run: flutter test --tags golden
      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/test/**/failures/
