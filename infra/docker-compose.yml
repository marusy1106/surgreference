# Локальное окружение разработки: docker compose -f infra/docker-compose.yml up
# Секреты берутся из ../.env (см. .env.example). Для локальной разработки образы
# с плавающими тегами допустимы; в stage/prod используются образы по digest.
name: surgreference

x-backend: &backend
  build:
    context: ../backend
    args:
      REQUIREMENTS: dev
  env_file: ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://surgreference:surgreference@db:5432/surgreference
    REDIS_URL: redis://redis:6379/0
    EMAIL_URL: smtp://mailpit:1025
    S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ../backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surgreference
      POSTGRES_PASSWORD: surgreference
      POSTGRES_DB: surgreference
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgreference"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

volumes:
  pgdata:
  miniodata:
